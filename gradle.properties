# Historique : 768m/384m suffisait tant qu'aucun module n'embarquait de gros
# assets. app/ embarque desormais ~550 Mo de modeles .onnx dans le debug
# APK - meme non compresses (noCompress += "onnx"), CompressAssetsWorkAction
# bufferise assez pour depasser 768m de heap (observe : "Java heap space").
# RAM disponible reverifiee avant d'augmenter (~7 Go libres au moment de ce
# changement, contre ~3,6 Go quand la limite precedente avait ete fixee).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Environnement contraint en RAM : compile le Kotlin dans le processus
# worker de Gradle plutot que de demarrer un daemon Kotlin separe (deuxieme
# JVM persistante) - evite les echecs "insufficient memory" observes avec la
# strategie par defaut.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
